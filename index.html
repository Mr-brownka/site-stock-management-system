<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#121315" />
    <meta name="description" content="Site Stock Management System: live stock balances for a construction site store." />
    <link rel="icon" href="/icon.svg" type="image/svg+xml" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Fonts load without holding up the first paint. -->
    <link rel="stylesheet" media="print" onload="this.media='all'" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=Cinzel:wght@400;600&family=Cormorant+Garamond:wght@300;400&family=Montserrat:wght@400&family=Playfair+Display:wght@500&family=Barlow:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap" />
    <title>Site Stock · Comex Builders</title>
    <style>
      /* Boot screen: painted instantly, before the app code arrives. */
      html, body { margin: 0; background: #121315; }
      #boot { position: fixed; inset: 0; z-index: 200; background: #121315; color: #F2F3F1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 26px; padding: 24px 24px 60px; overflow: hidden; font-family: Barlow, 'Segoe UI', system-ui, sans-serif; transition: opacity .45s ease, visibility .45s; }
      #boot.gone { opacity: 0; visibility: hidden; pointer-events: none; }
      #boot .bGlow { position: absolute; width: 460px; height: 460px; border-radius: 50%; left: 50%; top: 50%; margin: -290px 0 0 -230px; background: radial-gradient(circle, rgba(252,167,45,.18), rgba(252,167,45,0) 65%); animation: bBreathe 3s ease-in-out infinite; }
      #boot .bStage { position: relative; width: 132px; height: 132px; }
      #boot svg { width: 132px; height: 132px; overflow: visible; }
      #boot .f { transform-box: fill-box; transform-origin: center; }
      #boot .fl { animation: bInL .5s cubic-bezier(.2,.9,.3,1.2) both; }
      #boot .fr { animation: bInR .5s .08s cubic-bezier(.2,.9,.3,1.2) both; }
      #boot .lid { transform-box: fill-box; transform-origin: 0% 100%; animation: bLidIn .45s .35s cubic-bezier(.3,1.4,.5,1) both, bLid 2.4s 1.1s ease-in-out infinite; }
      #boot .drop { opacity: 0; animation: bDrop 2.4s 1.1s ease-in infinite; }
      #boot .drop.d2 { animation-delay: 1.35s; }
      #boot .drop.d3 { animation-delay: 1.6s; }
      #boot .tick { stroke-dasharray: 30; stroke-dashoffset: 30; opacity: 0; }
      #boot.ready .tick { opacity: 1; animation: bDraw .35s ease-out forwards; }
      #boot.ready .lid { animation: bLidShut .25s ease-out both; }
      #boot.ready .drop { animation: none; opacity: 0; }
      #boot.ready .bStage { animation: bPop .5s .3s cubic-bezier(.3,1.4,.5,1) both; }
      #boot .bName { text-align: center; display: flex; flex-direction: column; gap: 6px; position: relative; animation: bRise .5s .25s both; }
      #boot .bName b { font-family: 'Barlow Condensed', 'Arial Narrow', sans-serif; font-weight: 800; font-size: 36px; letter-spacing: .06em; line-height: 1; }
      #boot .bName span { font-family: 'IBM Plex Mono', ui-monospace, monospace; font-size: 11px; letter-spacing: .16em; color: #FCA72D; }
      #boot .bHello { min-height: 20px; font-size: 15px; color: #C9D0CD; text-align: center; position: relative; animation: bRise .5s .3s both; }
      #boot .bBar { position: relative; width: min(240px, 70vw); height: 4px; border-radius: 4px; background: #262C2B; overflow: hidden; animation: bRise .4s .35s both; }
      #boot .bBar i { position: absolute; left: 0; top: 0; bottom: 0; width: 6%; border-radius: 4px; background: linear-gradient(90deg, #E8901A, #FCA72D 70%, #FFD27A); transition: width .6s cubic-bezier(.2,.8,.2,1); }
      #boot .bBar i::after { content: ''; position: absolute; inset: 0; background: linear-gradient(90deg, transparent, rgba(255,255,255,.55), transparent); animation: bShine 1.4s ease-in-out infinite; }
      #boot .bMsg { min-height: 20px; font-size: 14px; color: #9AA3A0; text-align: center; position: relative; animation: bRise .4s .4s both; transition: opacity .25s; }
      #boot .bMsg.swap { opacity: 0; }
      #boot .bRetry { display: none; margin-top: 4px; min-height: 40px; padding: 0 18px; border-radius: 10px; border: 1px solid #3A4341; background: transparent; color: #F2F3F1; font: inherit; font-weight: 600; cursor: pointer; }
      #boot.slow .bRetry { display: inline-block; }
      @keyframes bBreathe { 0%, 100% { opacity: .55; transform: scale(.94); } 50% { opacity: 1; transform: scale(1.05); } }
      @keyframes bInL { from { opacity: 0; transform: translate(-26px, 10px); } to { opacity: 1; transform: none; } }
      @keyframes bInR { from { opacity: 0; transform: translate(26px, 10px); } to { opacity: 1; transform: none; } }
      @keyframes bLidIn { from { opacity: 0; transform: translateY(-34px); } to { opacity: 1; transform: none; } }
      @keyframes bLid { 0%, 55%, 100% { transform: none; } 12%, 38% { transform: translateY(-9px) rotate(-14deg); } }
      @keyframes bLidShut { to { transform: none; } }
      @keyframes bDrop { 0% { opacity: 0; transform: translateY(-34px); } 10% { opacity: 1; } 30% { opacity: 1; transform: translateY(6px); } 36%, 100% { opacity: 0; transform: translateY(10px); } }
      @keyframes bDraw { to { stroke-dashoffset: 0; } }
      @keyframes bPop { 0% { transform: none; } 45% { transform: scale(1.08); } 100% { transform: none; } }
      @keyframes bRise { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }
      @keyframes bShine { from { transform: translateX(-100%); } to { transform: translateX(100%); } }
      @media (prefers-reduced-motion: reduce) { #boot *, #boot { animation: none !important; transition: none !important; } #boot.ready .tick { stroke-dashoffset: 0; } }
    </style>
  </head>
  <body>
    <div id="boot" role="status" aria-live="polite">
      <div class="bGlow" aria-hidden="true"></div>
      <div class="bStage" aria-hidden="true">
        <svg viewBox="0 0 64 64">
          <rect width="64" height="64" rx="15" fill="#1E2322" />
          <rect class="drop" x="28" y="14" width="8" height="8" rx="1.5" fill="#FFD27A" />
          <rect class="drop d2" x="23" y="16" width="6" height="6" rx="1.2" fill="#FCA72D" />
          <rect class="drop d3" x="35" y="16" width="6" height="6" rx="1.2" fill="#F2F3F1" />
          <polygon class="f fl" points="11,21 32,32 32,55 11,44" fill="#F2F3F1" />
          <polygon class="f fr" points="32,32 53,21 53,44 32,55" fill="#9AA3A0" />
          <polygon class="lid" points="32,10 53,21 32,32 11,21" fill="#FCA72D" />
          <polyline class="tick" points="17,36 22,41 28,33" fill="none" stroke="#121315" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
        </svg>
      </div>
      <div class="bName"><b>SITE STOCK</b><span>COMEX BUILDERS</span></div>
      <div class="bHello" id="bootHello"></div>
      <div class="bBar" aria-hidden="true"><i id="bootBar"></i></div>
      <div class="bMsg" id="bootMsg">Connecting securely…</div>
      <button class="bRetry" type="button" onclick="location.reload()">Try again</button>
    </div>
    <script>
      // Greet a returning person by name straight away (saved on the last visit).
      try {
        var last = JSON.parse(localStorage.getItem('ssms-last') || 'null');
        if (last && last.name) document.getElementById('bootHello').textContent = 'Welcome back, ' + last.name + (last.site ? ' · ' + last.site : '');
      } catch (e) {}
      // Keep the bar moving while the app code downloads, so it never looks stuck.
      (function () { var w = 6, bar = document.getElementById('bootBar'); window.__bootCreep = setInterval(function () { if (w < 28) { w += (28 - w) * 0.12; bar.style.width = w + '%'; } }, 300); })();
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
